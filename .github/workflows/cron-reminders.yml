name: Dispatch Reminders Cron

on:
  schedule:
    # Runs every 10 minutes (100% free external cron trigger)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  dispatch-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Reminders Endpoint
        run: |
          TARGET_URL="${{ secrets.APP_URL }}"
          SECRET="${{ secrets.CRON_SECRET }}"
          if [ -n "$TARGET_URL" ]; then
            echo "Dispatching reminder cron to $TARGET_URL..."
            curl -f -s -X POST "$TARGET_URL/api/cron/dispatch-reminders" \
              -H "Authorization: Bearer $SECRET" \
              -H "Content-Type: application/json"
          else
            echo "APP_URL secret not defined. Skipping dispatch."
          fi
